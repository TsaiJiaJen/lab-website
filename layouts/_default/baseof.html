<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "zh-tw" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    
    <style>
        /* ==========================================
           1. 全域變數與主題色彩（方案三：生技薰衣草）
           ========================================== */
        :root {
            --primary-color: #321E53; /* 主色：深皇家紫 */
            --accent-color: #059669;  /* 強調色：活力翡翠綠（點綴用） */
            --text-main: #22222E;     /* 內文顏色：深紫灰 */
            --bg-body: #F4F1F8;       /* 網站大背景：淺霜紫 */
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-main);
            background-color: var(--bg-body);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* 導覽列固定在頂部 */
        header {
            background: white;
            box-shadow: 0 1px 3px rgba(50, 30, 83, 0.08);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .logo a {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        /* Banner 區塊：深紫漸層背景 */
        .hero-banner {
            background: linear-gradient(135deg, #24133F 0%, #4C287A 100%);
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 55px; /* 避開 Header */
            text-align: center;
            padding: 0 20px;
        }

        .hero-banner h1 {
            font-size: 2.2rem;
            margin: 0;
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            width: 92%;
            margin: 20px auto 60px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(50, 30, 83, 0.05);
            min-height: 400px;
            box-sizing: border-box;
        }

        .content-wrapper {
            display: flex;
            padding: 40px;
            gap: 40px;
        }

        /* 側邊欄 */
        .sidebar {
            width: 200px;
            flex-shrink: 0;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            position: sticky;
            top: 80px;
        }

        .sidebar-menu li {
            margin-bottom: 10px;
        }

        .sidebar-menu a {
            display: block;
            padding: 10px 15px;
            color: #555;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.2s;
        }

        /* 側邊欄當前選中項目（淡紫底 + 左側翡翠綠條點綴） */
        .sidebar-menu li.active a {
            background: #E8E2F1; 
            color: var(--primary-color);
            font-weight: 700;
            border-left: 4px solid var(--accent-color);
        }

        /* 主要內容 */
        .main-content {
            flex: 1;
            min-width: 0;
        }

        footer {
            background: #1B0F2E; /* 暗夜紫頁尾 */
            color: white;
            padding: 2rem;
            text-align: center;
            margin-top: auto;
        }

        /* ==========================================
           2. 手機版響應式微調 (RWD 解決畫面壓縮)
           ========================================== */
        @media (max-width: 768px) {
            .hero-banner {
                height: 120px;
            }

            .hero-banner h1 {
                font-size: 1.5rem;
            }

            .container {
                width: 95%;
                margin: 15px auto 30px;
            }

            /* 將原本左右併排的「側邊選單」與「內容」改為上下單欄 */
            .content-wrapper {
                flex-direction: column;
                padding: 20px;
                gap: 20px;
            }

            .sidebar {
                width: 100%;
            }

            /* 手機版側邊選單改為平舖橫向選單 */
            .sidebar-menu {
                position: static;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                border-bottom: 1px solid #E8E2F1;
                padding-bottom: 15px;
            }

            .sidebar-menu li {
                margin-bottom: 0;
            }

            .sidebar-menu a {
                padding: 6px 12px;
                font-size: 0.9rem;
            }

            .sidebar-menu li.active a {
                border-left: none;
                border-bottom: 3px solid var(--accent-color);
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a>
            </div>
        </nav>
    </header>

    <section class="hero-banner">
        <h1>{{ if .IsHome }}張淑微老師實驗室{{ else }}{{ .Title }}{{ end }}</h1>
    </section>

    <div class="container">
        <div class="content-wrapper">
            <aside class="sidebar">
                <ul class="sidebar-menu">
                    {{ range .Site.Menus.main }}
                    <li class="{{ if $.IsMenuCurrent "main" . }}active{{ end }}">
                        <a href="{{ .URL | absURL }}">{{ .Name }}</a>
                    </li>
                    {{ end }}
                </ul>
            </aside>
            <main class="main-content">
                {{ block "main" . }}{{ end }}
            </main>
        </div>
    </div>

    <footer>
        <p>&copy; {{ now.Format "2006" }} {{ .Site.Title }}</p>
    </footer>
</body>
</html>
