<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "zh-tw" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    
    <style>
        /* ==========================================
           1. 全域變數與主題色彩
           ========================================== */
        :root {
            --primary-color: #321E53;    /* 主色：深皇家紫（文字與 Logo） */
            --banner-bg: #663399;        /* Banner 指定色：紫色 */
            --container-bg: #E6E6FA;     /* 主容器指定色：薰衣草紫 */
            --purple-border: #D1C4E9;    /* 柔和邊框紫 */
            --text-main: #0F172A;        /* 內文：科技墨藍 */
            --bg-body: #F0F4F8;          /* 網站背景：科技灰藍 */
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-main);
            background-color: var(--bg-body);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* 導覽列：毛玻璃微透質感 */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .logo a {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        /* Hero Banner：#A020F0 背景 */
        .hero-banner {
            background-color: var(--banner-bg); /* #A020F0 */
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF; /* 白色標題文字 */
            margin-top: 55px; /* 避開 Fixed Header */
            text-align: center;
            padding: 0 20px;
            position: relative;
            overflow: hidden;
        }

        .hero-banner h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 1.5px;
        }

        /* 主容器：#E6E6FA 背景 */
        .container {
            max-width: 1200px;
            width: 92%;
            margin: 30px auto 60px;
            background-color: var(--container-bg); /* #E6E6FA */
            border-radius: 16px;
            border: 1px solid #DCD0FF;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
            min-height: 400px;
            box-sizing: border-box;
        }

        .content-wrapper {
            display: flex;
            padding: 40px;
            gap: 40px;
        }

        /* 側邊欄 */
        .sidebar {
            width: 220px;
            flex-shrink: 0;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            position: sticky;
            top: 90px;
        }

        .sidebar-menu li {
            margin-bottom: 6px;
        }

        .sidebar-menu a {
            display: block;
            padding: 10px 16px;
            color: #475569;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .sidebar-menu a:hover {
            color: var(--primary-color);
            background: rgba(255, 255, 255, 0.6);
        }

        /* 選中項目標籤 */
        .sidebar-menu li.active a {
            background: #FFFFFF;
            color: var(--primary-color);
            font-weight: 700;
            border-left: 4px solid var(--banner-bg);
            border-top-left-radius: 2px;
            border-bottom-left-radius: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* 主要內容區 */
        .main-content {
            flex: 1;
            min-width: 0;
        }

        footer {
            background: #0F172A;
            color: #94A3B8;
            padding: 2rem;
            text-align: center;
            margin-top: auto;
            font-size: 0.9rem;
            border-top: 1px solid #1E293B;
        }

        /* ==========================================
           2. 手機版響應式微調 (RWD)
           ========================================== */
        @media (max-width: 768px) {
            .hero-banner {
                height: 120px;
            }

            .hero-banner h1 {
                font-size: 1.5rem;
            }

            .container {
                width: 95%;
                margin: 15px auto 30px;
            }

            .content-wrapper {
                flex-direction: column;
                padding: 20px;
                gap: 20px;
            }

            .sidebar {
                width: 100%;
            }

            .sidebar-menu {
                position: static;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                border-bottom: 1px solid #DCD0FF;
                padding-bottom: 15px;
            }

            .sidebar-menu li {
                margin-bottom: 0;
            }

            .sidebar-menu a {
                padding: 6px 12px;
                font-size: 0.9rem;
            }

            .sidebar-menu li.active a {
                border-left: none;
                border-bottom: 3px solid var(--banner-bg);
                border-radius: 6px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a>
            </div>
        </nav>
    </header>

    <section class="hero-banner">
        <h1>{{ if .IsHome }}張淑微老師實驗室{{ else }}{{ .Title }}{{ end }}</h1>
    </section>

    <div class="container">
        <div class="content-wrapper">
            <aside class="sidebar">
                <ul class="sidebar-menu">
                    {{ range .Site.Menus.main }}
                    <li class="{{ if $.IsMenuCurrent "main" . }}active{{ end }}">
                        <a href="{{ .URL | absURL }}">{{ .Name }}</a>
                    </li>
                    {{ end }}
                </ul>
            </aside>
            <main class="main-content">
                {{ block "main" . }}{{ end }}
            </main>
        </div>
    </div>

    <footer>
        <p>&copy; {{ now.Format "2006" }} {{ .Site.Title }}</p>
    </footer>
</body>
</html>
